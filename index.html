<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ExamHub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
html,body{margin:0;overscroll-behavior:none}
body{font:16px/1.5 system-ui,-apple-system,'Noto Sans Oriya','Noto Sans',sans-serif;background:#f4f5fb;color:#1f2340;min-height:100vh}
#app{max-width:640px;margin:auto;padding:max(env(safe-area-inset-top),10px) 16px 96px}
h1,h2,h3,h4{margin:.4em 0}.mu{color:#6b7090;margin:2px 0 10px}.c{text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#4f46e5;box-shadow:0 1px 6px #0002;display:flex;align-items:center;justify-content:center;font-size:20px}
.hero{text-align:center;padding:40px 0 30px}.logo{width:96px;height:96px;border-radius:24px}
.b{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin:10px 0;background:#4f46e5;color:#fff;font:600 16px inherit;font-family:inherit}
.b.o{background:#fff;color:#4f46e5;border:2px solid #4f46e5}.b.g{background:#e6e8f5;color:#333a66}
.b.sm{width:auto;padding:8px 14px;margin:0 0 6px;font-size:14px}.b:disabled{opacity:.5}.b:active{transform:scale(.98)}
label{display:block;margin:14px 0 6px;font-weight:600}
input,textarea,select{width:100%;padding:13px;border:2px solid #dfe3f1;border-radius:12px;font:16px inherit;font-family:inherit;background:#fff;color:inherit}
input:focus,textarea:focus{outline:0;border-color:#4f46e5}
.card,.card2{background:#fff;border-radius:18px;padding:18px;box-shadow:0 1px 8px #0001;margin:12px 0}
.card{text-align:center}.card2 ul{padding-left:18px;margin:6px 0}.card2 li{margin:6px 0}
.big{font-size:54px;font-weight:800;color:#4f46e5;line-height:1.1}.big span{font-size:22px;color:#6b7090}
.pct{font-size:24px;font-weight:700}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#e6e8f5;color:#555}
.tag.ok{background:#d1fae5;color:#047857}.tag.no{background:#fee2e2;color:#b91c1c}
.cd{font:700 40px ui-monospace,monospace;text-align:center;color:#4f46e5;margin:10px 0}
.eh{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;background:#fff;margin:0 -16px;padding:max(env(safe-area-inset-top),8px) 14px 8px;box-shadow:0 1px 6px #0002}
.en{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}.en b,.en small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr{font:700 17px ui-monospace,monospace;color:#4f46e5}
.qh{font-weight:700;color:#6b7090;margin:14px 0 6px}
.q{font-size:18px;overflow-wrap:anywhere;margin:6px 0 10px}.qi{max-width:100%;border-radius:10px;margin:6px 0;display:block}
.op{display:flex;gap:10px;width:100%;text-align:left;border:2px solid #dfe3f1;background:#fff;color:inherit;border-radius:12px;padding:12px;margin:8px 0;font:16px inherit;font-family:inherit;overflow-wrap:anywhere}
.op>span:last-child{flex:1;min-width:0}.l{font-weight:700;color:#4f46e5;min-width:20px}
.op.sel{background:#4f46e5;border-color:#4f46e5;color:#fff}.op.sel .l{color:#fff}
.op.cor{background:#d1fae5;border-color:#10b981}.op.wrg{background:#fee2e2;border-color:#ef4444}
.rq{background:#fff;border-radius:16px;padding:12px 14px;margin:12px 0;box-shadow:0 1px 6px #0001}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px max(env(safe-area-inset-bottom),10px);background:#fff;box-shadow:0 -1px 6px #0002;max-width:640px;margin:auto}
.nav .b{margin:0}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
#pal{position:fixed;inset:0;z-index:20;display:none}#pal.on{display:flex}
#pal .bk{flex:1;background:#0006}#pal .sd{width:82%;max-width:340px;background:#fff;padding:16px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.pn{height:44px;border-radius:10px;border:2px solid #dfe3f1;background:#fff;font:600 15px inherit;color:inherit}
.pn.a{background:#10b981;border-color:#10b981;color:#fff}.pn.c{outline:3px solid #4f46e5;outline-offset:1px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;background:#dfe3f1;margin:0 4px 0 8px}.dot.g{background:#10b981}
#ov{position:fixed;inset:0;z-index:30;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}#ov.on{display:flex}
.md{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:360px}.row{display:flex;gap:10px}.row .b{margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1f2340;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90%;text-align:center}#toast.on{opacity:1}
.t{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}.t td{padding:11px 14px;border-bottom:1px solid #eef0f8}.t td:last-child{text-align:right}
.ok2{font-size:64px;color:#10b981;margin-top:40px}
</style></head>
<body>
<div id="app"></div>
<div id="pal"><div class="bk" data-a="pc"></div><div class="sd"></div></div>
<div id="ov"></div><div id="toast"></div>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="app.js"></script>
</body></html>
